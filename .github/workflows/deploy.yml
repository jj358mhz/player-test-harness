# =============================================================================
# Deploy to Utility Pi
# =============================================================================
# Triggered on every push to main, on pushing a version tag (so `git describe`
# resolves to a clean vN.N.N once the release tag lands after the merge), or
# manually via workflow_dispatch (e.g. `gh workflow run deploy.yml`).
# SSHes into the Utility Pi, pulls the latest commit, rebuilds and restarts
# the player-test-harness Docker container.

name: Deploy to Utility Pi

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Merging two PRs back to back starts two deploys; run them one at a time so
# they don't race on `docker compose up` (container name conflict).
concurrency:
  group: deploy-utility-pi
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 2222
          # Under the job's timeout-minutes, so a hung remote command fails as a
          # clear ssh-action timeout instead of a silent job cancel. Long enough
          # for a Docker build without cache (npm ci and Vite on the Pi).
          command_timeout: 12m
          script: |
            set -e
            cd ~/git/player-test-harness
            # The Pi -> GitHub SSH connection occasionally stalls, and neither
            # git nor ssh time out by default, so a fetch could hang until the
            # job was cancelled. Bound each attempt and retry.
            export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
            for attempt in 1 2 3; do
              if timeout 60 git fetch --tags --force; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "git fetch failed after 3 attempts" >&2
                exit 1
              fi
              echo "git fetch attempt $attempt failed or timed out; retrying in 5s"
              sleep 5
            done
            # Fast-forward from the refs just fetched rather than `git pull`,
            # which would make a second (unbounded) round-trip to GitHub.
            git merge --ff-only origin/main
            export APP_VERSION="$(git describe --tags --always --dirty)"
            echo "Building version: $APP_VERSION"
            APP_VERSION="$APP_VERSION" docker compose up -d --build
            docker image prune -a -f --filter "label=app=player-test-harness" --filter "until=24h"
            echo "Deploy complete: $(git rev-parse --short HEAD) as $APP_VERSION"
